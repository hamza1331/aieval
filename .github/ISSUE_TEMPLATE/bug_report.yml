name: Bug report
description: Something doesn't behave as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: aieval version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The output, checks and options you passed to `evaluate` (or the fixture file for the CLI).
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual result
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and OS
